name: Weekly AI Radar Magazine

on:
  schedule:
    # 每周一北京时间早上 9:00（UTC 周一 01:00）
    - cron: '0 1 * * 1'
  workflow_dispatch: # 手动触发

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Fetch news (24h window, extend to 7d for weekly)
        run: |
          python scripts/update_news.py --output-dir data --window-hours 168

      - name: Generate magazine HTML
        run: |
          python scripts/generate_magazine.py \
            --input data/daily-brief.json \
            --output data/weekly-magazine.html \
            --title "AI 雷达周报" \
            --subtitle "AI Radar Weekly"

      - name: Copy magazine to Pages root
        run: |
          cp data/weekly-magazine.html index.html

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ index.html
          git commit -m "weekly magazine: $(date -u +%Y-%m-%d)" || exit 0
          git push

      - name: Notify Feishu
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_BOT_OPEN_ID: ${{ secrets.FEISHU_BOT_OPEN_ID }}
          MAGAZINE_URL: ${{ vars.MAGAZINE_URL || 'https://shiyuxuan1116-dev.github.io/xuan/' }}
        run: |
          python scripts/notify_feishu.py
