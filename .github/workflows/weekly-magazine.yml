# 工作流

获取 GitHub Actions 工作流的简要概述，包括触发器、语法和高级功能。

## 关于工作流程

**工作流**是一个可配置的自动化过程，它将运行一个或多个作业。 工作流程由签入到存储库的 YAML 文件定义，并在存储库中的事件触发时运行，也可以手动触发，或按定义的时间表触发。

工作流在仓库的 `.github/workflows` 目录中定义。 一个仓库可以有多个工作流，每个工作流都可以执行一组不同的任务，例如：

* 构建和测试拉取请求
* 在每次创建发布时，部署应用程序
* 每当创建新提议时，添加标签

## 工作流基础知识

工作流必须包含以下基本组件：

1. 一个或多个将触发工作流的事件。
2. 一个或多个\_作业\_，每个作业都将在\_运行器\_计算机上执行，并运行一系列一个或多个\_步骤\_。
3. 每个步骤都可以运行你定义的脚本或运行操作，这是一个可简化工作流的可重用扩展。

有关这些基本组件的详细信息，请参阅“[了解GitHub Actions](/zh/actions/learn-github-actions/understanding-github-actions#the-components-of-github-actions)”。

