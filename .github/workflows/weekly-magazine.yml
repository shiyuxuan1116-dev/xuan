## 工作流触发器

工作流程触发器是导致工作流程运行的事件。 这些事件可以是：

* 工作流程存储库中发生的事件
* 在 GitHub 外部发生并在 GitHub 上触发 `repository_dispatch` 事件的事件
* 预定时间
* 手动

例如，您可以将工作流程配置为在推送到存储库的默认分支、创建发行版或打开议题时运行。

工作流触发器使用 `on` 键定义。 有关详细信息，请参阅“[GitHub Actions 的工作流语法](/zh/actions/using-workflows/workflow-syntax-for-github-actions#on)”。

以下步骤将触发工作流程运行：

1. 存储库上发生事件。 该事件具有关联的提交 SHA 和 Git 引用。
2. GitHub 在仓库的根的 `.github/workflows` 目录中搜索事件的关联提交 SHA 或 Git 引用中存在的工作流文件。
3. 对于具有与触发事件匹配的 `on:` 值的任何工作流，触发工作流运行。 某些事件还要求工作流程文件位于存储库的默认分支上才能运行。

每个工作流程运行都将使用事件的关联提交 SHA 或 Git ref 中存在的工作流程版本。 当工作流运行时，GitHub 会在运行器环境中设置 `GITHUB_SHA`（提交 SHA）和 `GITHUB_REF`（Git 引用）环境变量。 有关详细信息，请参阅“[在变量中存储信息](/zh/actions/learn-github-actions/variables)”。

有关详细信息，请参阅“[触发工作流程](/zh/actions/using-workflows/triggering-a-workflow)”。

